<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  /* ---------- Палитра в стиле VK ---------- */
  :root {
    color-scheme: light dark;
    --bg: #edeef0;            /* фон VK (light) */
    --fg: #000000;
    --fg-secondary: #656565;
    --card: #ffffff;
    --sep: #e1e3e6;
    --accent: #2787f5;        /* фирменный синий VK */
    --accent-hover: #1e6fd9;
    --accent-light: #e8f2fe;
    --danger: #e64646;
    --ok: #4bb34b;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.06);
    --radius: 12px;
  }
  body.dark {
    --bg: #19191a;
    --fg: #e1e3e6;
    --fg-secondary: #939393;
    --card: #232324;
    --sep: #333333;
    --accent: #4b9bf7;
    --accent-hover: #6baaf9;
    --accent-light: #1c2a3a;
    --danger: #ff5252;
    --ok: #6fdb6f;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    width: 380px;
    min-height: 500px;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Шапка ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--sep);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
    flex: 0 0 auto;
    letter-spacing: -1px;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    flex: 1;
    font-weight: 600;
    letter-spacing: -.2px;
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--fg-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background .15s, color .15s;
    flex: 0 0 auto;
  }
  .icon-btn:hover { background: var(--accent-light); color: var(--accent); }

  /* ---------- Контент ---------- */
  main {
    padding: 14px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-secondary);
    margin-bottom: 6px;
    letter-spacing: .2px;
  }

  input[type=password], input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--sep);
    background: var(--bg);
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  body.dark input[type=password], body.dark input[type=text] { background: #1c1c1d; }
  input[type=password]:focus, input[type=text]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(39,135,245,.15);
  }

  /* ---------- Кнопки ---------- */
  button {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, transform .05s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.secondary {
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--sep);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--accent-light);
    border-color: var(--accent);
  }
  button.small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* ---------- Плашка токена ---------- */
  .token-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--sep);
    font-size: 13px;
    box-shadow: var(--shadow);
  }
  .token-line.ok { border-color: var(--ok); }
  .token-line.bad { border-color: var(--danger); }
  .token-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    flex: 0 0 auto;
  }
  .token-line.ok .token-avatar { background: var(--ok); }
  .token-line.bad .token-avatar { background: var(--danger); }
  .token-line .who {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px;
  }
  .token-line .who b { color: var(--fg); font-weight: 600; }

  /* ---------- Статус ---------- */
  #status {
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--sep);
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.4;
    border-left-width: 3px;
  }
  #status.ok { color: var(--ok); border-color: var(--ok); display: block; background: rgba(75,179,75,.08); }
  #status.err { color: var(--danger); border-color: var(--danger); display: block; background: rgba(230,70,70,.08); }
  #status.info { display: block; color: var(--fg-secondary); }

  /* ---------- Карточка трека ---------- */
  .track-card {
    background: var(--card);
    border: 1px solid var(--sep);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: none;
    box-shadow: var(--shadow);
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .track-card.show { display: block; }
  .track-title { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .track-meta { font-size: 12px; color: var(--fg-secondary); margin-top: 4px; }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(75,179,75,.15);
    color: var(--ok);
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 600;
  }
  .badge.bad { background: rgba(230,70,70,.15); color: var(--danger); }

  /* ---------- Подсказки ---------- */
  .hint {
    font-size: 11.5px;
    color: var(--fg-secondary);
    line-height: 1.45;
  }
  .hint a { color: var(--accent); text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  .footer-hint { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--sep); }
  .footer-hint b { color: var(--fg); font-weight: 600; }
  code {
    background: var(--accent-light);
    color: var(--accent);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* Скрытие группы токена через style.display — id сохранён */
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>VK Moosic Downloader</h1>
  <button id="theme" class="icon-btn" title="Тема">🌓</button>
</header>

<main>
  <!-- Плашка статуса токена -->
  <div id="tokenInfo" class="token-line" style="display:none;">
    <div class="token-avatar" id="tokenAvatar">?</div>
    <span class="who" id="tokenWho"></span>
    <button id="changeTokenBtn" class="secondary small">Сменить</button>
  </div>

  <!-- Блок ввода токена -->
  <div id="tokenGroup" style="display:none;">
    <label for="token">Токен VK (права: audio)</label>
    <input id="token" type="password" placeholder="vk1.a...." autocomplete="off">
    <div class="hint" style="margin-top:6px;">
      Получить: <a href="https://vkhost.github.io/" target="_blank" rel="noopener">vkhost.github.io</a>
      → приложение с правами <b>audio</b>. Хранится только в этом браузере.
    </div>
    <div class="row" style="margin-top:8px;">
      <button id="saveTokenBtn" class="secondary">Сохранить и проверить</button>
    </div>
  </div>

  <div>
    <label for="url">Ссылка на трек VK</label>
    <input id="url" type="text" placeholder="https://vk.com/audio-123_456" autocomplete="off">
  </div>

  <div class="row">
    <button id="checkBtn" class="secondary">Проверить</button>
    <button id="downloadBtn">Скачать MP3</button>
  </div>

  <div id="status"></div>

  <div id="trackCard" class="track-card">
    <div class="track-title" id="trackTitle">—</div>
    <div class="track-meta" id="trackMeta">—</div>
  </div>

  <div class="hint footer-hint">
    Файлы сохраняются в <b>Загрузки/vk-moosic/</b>.<br>
    Если VK отдаёт <code>.m3u8</code> — прямое скачивание в mp3 невозможно.
  </div>
</main>

<script src="popup.js"></script>
</body>
</html>
